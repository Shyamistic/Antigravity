[package]
name    = "antigravity-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name       = "antigravity_core"

[features]
no-entrypoint = []
no-idl        = []
no-log-ix-name = []
cpi           = ["no-entrypoint"]
default       = []

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl  = { version = "0.31.0", features = ["token_2022", "associated_token", "token_2022_extensions"] }
spl-token-2022 = { version = "=3.0.4", features = ["no-entrypoint"] }
spl-tlv-account-resolution = { version = "=0.6.5" }
spl-transfer-hook-interface = { version = "=0.6.5" }
spl-type-length-value = { version = "=0.4.6" }
bytemuck = { version = "1.14", features = ["derive"] }
